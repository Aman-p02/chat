<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MQTT.js CDN -->
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main App Shell: Exactly 100dvh, No Page Scroll -->
  <div class="flex flex-col h-full w-full max-w-3xl mx-auto bg-slate-950 border-x border-slate-800/60 overflow-hidden shadow-2xl">
    
    <!-- Ultra-Clean Compact Header -->
    <header class="shrink-0 h-14 bg-slate-900/95 border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between z-10">
      
      <!-- Left: Title & Status Dot -->
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-base text-white">Chat</span>
          <span id="connectionBadge" class="flex items-center gap-1 text-[11px] text-amber-400 font-medium">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            Connecting
          </span>
        </div>
      </div>

      <!-- Right: User Name & Controls -->
      <div class="flex items-center space-x-1.5 sm:space-x-2">
        <!-- Compact Name Edit -->
        <div class="flex items-center gap-1 bg-slate-800 border border-slate-700/80 px-2 py-1 rounded-lg">
          <span class="text-xs text-slate-400">👤</span>
          <input type="text" id="usernameInput" maxlength="15" title="Tap to change your name" 
                 class="w-16 sm:w-24 bg-transparent text-xs font-semibold text-emerald-400 focus:outline-none text-center" />
        </div>

        <!-- Sound Toggle -->
        <button id="soundToggleBtn" title="Toggle Sound" class="p-1.5 sm:p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-xs sm:text-sm">
          <span id="soundIcon">🔊</span>
        </button>

        <!-- Clear Chat -->
        <button id="clearChatBtn" title="Clear Chat" class="p-1.5 sm:p-2 rounded-lg bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition text-xs sm:text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>

    </header>

    <!-- Scrollable Messages Container (Only this scrolls) -->
    <div id="messagesContainer" class="flex-1 min-h-0 overflow-y-auto p-3 sm:p-4 space-y-2.5 overscroll-contain">
      <!-- Chat bubbles render here dynamically -->
    </div>

    <!-- Live Typing Bar (Above Input) -->
    <div id="typingIndicator" class="hidden shrink-0 px-4 py-1 text-xs text-indigo-400 italic flex items-center gap-1.5 bg-slate-900/60 border-t border-slate-800/40">
      <span class="inline-flex gap-1 items-center">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.2s]"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.4s]"></span>
      </span>
      <span id="typingText">Typing...</span>
    </div>

    <!-- Pinned Bottom Type Box (Always visible on mobile & desktop) -->
    <footer class="shrink-0 bg-slate-900 border-t border-slate-800 p-2 sm:p-3 safe-bottom">
      <form id="chatForm" class="flex items-center gap-2" onsubmit="return false;">
        
        <!-- Photo Send Button -->
        <label title="Send Photo" class="shrink-0 p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 active:scale-95 cursor-pointer transition flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <input type="file" id="imageInput" accept="image/*" class="hidden" />
        </label>

        <!-- Message Input Textbox -->
        <input type="text" id="messageInput" autocomplete="off" placeholder="Type a message..." 
               class="flex-1 min-w-0 px-3.5 py-2.5 sm:py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-400 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />

        <!-- Send Button -->
        <button type="submit" id="sendBtn" class="shrink-0 py-2.5 px-4 sm:py-3 sm:px-5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold rounded-xl shadow-md shadow-indigo-600/30 flex items-center justify-center transition">
          <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-16 right-4 z-50 transform -translate-y-12 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 text-white px-3.5 py-2 rounded-xl border border-slate-700 shadow-xl flex items-center gap-2 text-xs sm:text-sm">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">Notification</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
