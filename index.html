<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Direct Chat - Instant Realtime Messaging</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MQTT.js CDN for instant zero-config serverless realtime websocket -->
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Background decorative glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand & Status -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight text-white flex items-center gap-2">
            Direct Chat
            <span id="connectionBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
              Connecting...
            </span>
          </h1>
          <p class="text-xs text-slate-400">Direct Live Chat &bull; No Room Codes</p>
        </div>
      </div>

      <!-- User Profile & Action Controls -->
      <div class="flex items-center space-x-2">
        <!-- Name edit pill -->
        <div class="flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 px-2.5 py-1.5 rounded-xl">
          <span class="text-xs text-slate-400">👤</span>
          <input type="text" id="usernameInput" maxlength="15" title="Click to change your name" 
                 class="w-20 sm:w-28 bg-transparent text-xs sm:text-sm font-semibold text-emerald-400 focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded px-1" />
        </div>

        <!-- Sound Toggle -->
        <button id="soundToggleBtn" title="Toggle Sound" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-sm">
          <span id="soundIcon">🔊</span>
        </button>

        <!-- Clear Chat -->
        <button id="clearChatBtn" title="Clear Messages" class="p-2 rounded-xl bg-slate-800 hover:bg-rose-500/20 text-slate-300 hover:text-rose-400 transition text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Chat Window (DIRECT - NO LOBBY) -->
  <main class="flex-1 flex flex-col max-w-4xl w-full mx-auto p-2 sm:p-4 overflow-hidden">
    
    <div class="flex-1 flex flex-col h-[calc(100vh-5.5rem)] sm:h-[calc(100vh-6.5rem)] bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-xl">
      
      <!-- Messages Stream Area -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3.5 scroll-smooth">
        <!-- Direct Welcome banner -->
        <div class="flex justify-center">
          <div class="bg-slate-800/70 border border-slate-700/60 rounded-xl px-4 py-2 text-xs text-slate-300 text-center max-w-md shadow-sm">
            ✨ <strong class="text-white">Direct Chat Active:</strong> Dono log bas is website ko kholein aur message type karein. Message instant saamne wale ko dikhega!
          </div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="hidden px-6 py-1.5 text-xs text-indigo-400 italic flex items-center gap-2">
        <span class="inline-flex gap-1 items-center">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.2s]"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.4s]"></span>
        </span>
        <span id="typingText">Someone is typing...</span>
      </div>

      <!-- Quick Emoji Bar -->
      <div class="px-4 py-1.5 bg-slate-900/70 border-t border-slate-800/80 flex items-center gap-2 overflow-x-auto text-base">
        <span class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold mr-1">Quick:</span>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="👍">👍</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="❤️">❤️</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="😂">😂</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="🔥">🔥</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="😍">😍</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="🎉">🎉</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="👋">👋</button>
        <button class="quick-emoji hover:scale-125 transition-transform" data-emoji="🙏">🙏</button>
      </div>

      <!-- Chat Input Form -->
      <div class="p-3 sm:p-4 bg-slate-800/60 border-t border-slate-700/80">
        <form id="chatForm" class="flex items-center gap-2" onsubmit="return false;">
          
          <!-- Image Send Button -->
          <label title="Send Photo" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer transition flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <input type="file" id="imageInput" accept="image/*" class="hidden" />
          </label>

          <!-- Text Input -->
          <input type="text" id="messageInput" autocomplete="off" placeholder="Type a message... (Press Enter)" 
                 class="flex-1 px-4 py-3 bg-slate-800 border border-slate-700/80 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm sm:text-base" />

          <!-- Send Button -->
          <button type="submit" id="sendBtn" class="py-3 px-5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center transition">
            <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
            </svg>
          </button>
        </form>
      </div>

    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 text-white px-4 py-2.5 rounded-xl border border-slate-700 shadow-xl flex items-center gap-2 text-sm">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">Notification</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
